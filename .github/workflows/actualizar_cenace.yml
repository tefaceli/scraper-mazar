name: Actualizar CENACE

on:
  schedule:
    - cron: '0 10 * * *'   # 05:00 Ecuador -> informe de CENACE del dia anterior
  workflow_dispatch:        # para probarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      - run: python scripts/scraper_cenace.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualiza datos CENACE"
          git push
