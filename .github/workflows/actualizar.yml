name: Actualizar cota Mazar

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'madrugada o dia'
        required: true
        default: 'dia'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scripts/actualizar_cota.py ${{ github.event.inputs.modo }}

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualiza cota Mazar"
          git pull --rebase origin main
          git push
