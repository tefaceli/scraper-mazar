name: Actualizar cota Mazar

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'madrugada o dia'
        required: true
        default: 'dia'
      fecha_forzar:
        description: 'Fecha a rellenar (YYYY-MM-DD), vacio = corre normal'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Forzar la fecha del sistema si se especifico
        if: ${{ github.event.inputs.fecha_forzar != '' }}
        run: |
          FECHA_OBJETIVO="${{ github.event.inputs.fecha_forzar }}"
          FECHA_SIGUIENTE=$(date -u -d "$FECHA_OBJETIVO +1 day" +%Y-%m-%d)
          sudo date -u -s "$FECHA_SIGUIENTE 12:00:00"

      - run: python scripts/actualizar_cota.py ${{ github.event.inputs.modo }}

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualiza cota Mazar"
          git pull --rebase origin main
          git push
