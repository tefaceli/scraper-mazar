name: Actualizar caudal CCS

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a forzar (YYYY-MM-DD), vacio = usa el dia anterior'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scripts/scraper_ccs.py "${{ github.event.inputs.fecha }}"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualiza caudal CCS"
          git pull --rebase origin main
          git push
